<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画风库 · 全部图片</title>
<style>
:root{
  --bg:#0d0f12; --bg2:#12151a; --panel:#171b21; --line:rgba(255,255,255,.075);
  --tx:#e8eaee; --tx2:#9aa2b1; --tx3:#646c7a;
  --accent:#7aa2ff; --danger:#ff6b6b; --ok:#4ade80;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--tx);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3038;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* header */
header{
  position:sticky;top:0;z-index:60;background:rgba(13,15,18,.86);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:14px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(122,162,255,.13)}
.stat{color:var(--tx3);font-size:12.5px;font-variant-numeric:tabular-nums}
.spacer{flex:1}

.search{position:relative}
.search input{
  width:230px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px 7px 30px;outline:none;transition:.15s;
}
.search input:focus{border-color:rgba(122,162,255,.55);box-shadow:0 0 0 3px rgba(122,162,255,.12)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.4}

.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--tx2);
  transition:.15s;white-space:nowrap;
}
.btn:hover{background:#1e232a;color:var(--tx);border-color:rgba(255,255,255,.13)}
.btn.on{background:rgba(122,162,255,.14);border-color:rgba(122,162,255,.45);color:#c7d7ff}
.btn.danger{color:#ffb4b4}
.btn.danger:hover{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4)}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;padding:0 20px 11px;overflow:hidden}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;flex:1;scrollbar-width:thin}
.chip{
  padding:5px 11px;border-radius:20px;border:1px solid var(--line);
  background:transparent;color:var(--tx2);font-size:12.5px;white-space:nowrap;transition:.15s;
}
.chip:hover{color:var(--tx);border-color:rgba(255,255,255,.16)}
.chip.on{background:#e8eaee;color:#111418;border-color:#e8eaee;font-weight:600}
.chip b{font-weight:600;opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}

select.sort{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:6px 9px;color:var(--tx2);outline:none;cursor:pointer;
}

/* grid */
main{padding:6px 20px 90px}
/* 瀑布流：行高 2px 的微网格，由 JS 按真实图片比例算 span。
   图片永远按原始比例完整显示，不再被 1:1 方框裁掉两头。 */
.grid{
  display:grid;gap:13px;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  grid-auto-rows:2px;
}
/* 大图模式：每行少放几张，手机上单列铺满，细节看得清 */
body.big .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{
  position:relative;border-radius:var(--r);overflow:hidden;background:var(--panel);
  border:1px solid var(--line);cursor:zoom-in;transition:transform .16s,border-color .16s;
  display:flex;flex-direction:column;grid-row-end:span 40;
}
.card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18)}
.card .pic{position:relative;aspect-ratio:var(--ar,3/4);flex:0 0 auto;overflow:hidden;background:#0f1216}
.card img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .35s}
.card img.loaded{opacity:1}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;color:#2a3038;font-size:22px}

/* 角色名常显：触屏没有 hover，放图下面才不会看不到 */
.card .cap{padding:6px 9px 8px;border-top:1px solid var(--line);background:var(--panel);
  height:52px;flex:1 0 auto;overflow:hidden}
.card .c1{
  font-size:12.5px;font-weight:500;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card .c2{
  font-size:10.5px;color:var(--tx3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card.untagged .c1{color:var(--tx2)}
.card.untagged .c1::after{
  content:"待标注";font-size:9.5px;color:var(--tx3);border:1px solid var(--line);
  border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px;
}

.card .ov{
  position:absolute;inset:auto 0 0 0;padding:24px 9px 8px;
  background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0));
  opacity:0;transition:.18s;pointer-events:none;
}
.card:hover .ov{opacity:1}
.card .nm{
  font-size:11.5px;color:#dfe4ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px #000;
}
.card .mt{font-size:10.5px;color:#9aa2b1;margin-top:2px}

.card .kill{
  position:absolute;top:7px;right:7px;width:27px;height:27px;border-radius:8px;
  background:rgba(10,12,15,.72);backdrop-filter:blur(6px);
  color:#ffb4b4;display:grid;place-items:center;opacity:0;transition:.15s;
  border:1px solid rgba(255,107,107,.28);
}
.card:hover .kill{opacity:1}
.card .kill:hover{background:rgba(255,107,107,.9);color:#fff}

.card .save{
  position:absolute;top:7px;right:40px;width:27px;height:27px;border-radius:8px;
  background:rgba(10,12,15,.72);backdrop-filter:blur(6px);
  color:#c7d7ff;display:grid;place-items:center;opacity:.55;transition:.15s;
  border:1px solid rgba(122,162,255,.3);font-size:15px;line-height:1;z-index:3;
}
.card:hover .save{opacity:1}
.card .save:hover{background:rgba(122,162,255,.92);color:#08101f}
/* 触屏没有 hover，两个角标常显，否则手机上根本按不到 */
@media (hover:none){
  .card .kill,.card .save{opacity:.92}
}

.card .tick{
  position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:7px;
  border:1.5px solid rgba(255,255,255,.55);background:rgba(10,12,15,.55);
  display:none;place-items:center;
}
body.selecting .card .tick{display:grid}
body.selecting .card .kill{display:none}
body.selecting .card .save{display:none}
body.selecting .card{cursor:pointer}
.card.sel{outline:2px solid var(--accent);outline-offset:-2px}
.card.sel .tick{background:var(--accent);border-color:var(--accent);color:#08101f}

.sentinel{height:40px;display:grid;place-items:center;color:var(--tx3);font-size:12.5px}
.empty{padding:80px 20px;text-align:center;color:var(--tx3)}
.grid .empty{grid-column:1/-1;grid-row-end:span 60}
.empty b{display:block;color:var(--tx2);font-size:15px;margin:10px 0 4px}

/* selection bar */
.selbar{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);
  display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;
  background:#1b2027;border:1px solid rgba(255,255,255,.13);border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:80;transition:transform .22s cubic-bezier(.2,.9,.25,1);
}
.selbar.show{transform:translate(-50%,0)}
.selbar .cnt{font-size:13px;color:var(--tx2)}
.selbar .cnt b{color:var(--tx);font-size:15px}

/* lightbox：默认「适应屏幕」看全图，点图切 1:1 原始像素，stage 可拖/滚 */
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,7,9,.96);display:none;
    backdrop-filter:blur(6px)}
.lb.show{display:grid;grid-template-columns:1fr 320px}
.lb .stage{position:relative;display:flex;padding:28px;overflow:auto;
           overscroll-behavior:contain}
.lb .stage img{flex:0 0 auto;margin:auto;max-width:100%;max-height:calc(100vh - 56px);
               object-fit:contain;border-radius:6px;cursor:zoom-in;
               box-shadow:0 24px 70px rgba(0,0,0,.7)}
.lb .stage img.actual{max-width:none;max-height:none;cursor:zoom-out;border-radius:0;
                      box-shadow:none}
.lb .hint{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:2;
  font-size:11.5px;color:#8b93a3;background:rgba(10,12,16,.72);border:1px solid var(--line);
  padding:4px 10px;border-radius:20px;pointer-events:none;opacity:0;transition:.2s;
}
.lb .stage:hover .hint{opacity:1}
.lb .nav{
  position:absolute;top:50%;transform:translateY(-50%);width:42px;height:66px;
  display:grid;place-items:center;border-radius:10px;color:#cfd6e2;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
}
.lb .nav:hover{background:rgba(255,255,255,.13)}
.lb .nav.prev{left:14px} .lb .nav.next{right:14px}
.lb .close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;
           background:rgba(255,255,255,.07);display:grid;place-items:center}
.lb .close:hover{background:rgba(255,255,255,.16)}

.side{background:var(--bg2);border-left:1px solid var(--line);padding:20px;overflow:auto}
.side .grab{display:block;margin:0 0 5px;font-size:14px;font-weight:600;
            word-break:break-all;line-height:1.4}
.side .grab i{display:none}
.side .grab .gi{display:none}
.side h3{font-size:14px;margin:0 0 4px;word-break:break-all;line-height:1.4}
.side .sub{color:var(--tx3);font-size:12px;word-break:break-all;margin-bottom:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12.5px;
    border-bottom:1px solid rgba(255,255,255,.045)}
.kv span{color:var(--tx3)}
.kv b{font-weight:500;text-align:right;word-break:break-all}
.side .acts{display:grid;gap:8px;margin-top:20px}
/* 原图链接用 <a>，需要手动对齐 button 的盒模型和居中 */
.side .acts a.btn{display:flex;align-items:center;justify-content:center;
  text-decoration:none;box-sizing:border-box;line-height:1.2}

/* trash */
.drawer{
  position:fixed;top:0;right:0;height:100%;width:390px;z-index:95;background:var(--bg2);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.9,.25,1);
  display:flex;flex-direction:column;
}
.drawer.show{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h4{margin:0;font-size:14px}
.drawer .db{flex:1;overflow:auto;padding:10px 12px}
.tr{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid transparent}
.tr:hover{background:#181d24;border-color:var(--line)}
.tr .nm{flex:1;min-width:0}
.tr .nm div:first-child{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .nm div:last-child{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr button{font-size:12px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--tx2)}
.tr button:hover{color:var(--tx);background:#20262e}
.drawer .df{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none}
.scrim.show{display:block}

/* modal */
.modal{position:fixed;inset:0;z-index:120;display:none;place-items:center;background:rgba(4,5,7,.7)}
.modal.show{display:grid}
.mbox{width:min(430px,calc(100vw - 40px));background:var(--bg2);border:1px solid rgba(255,255,255,.11);
      border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.mbox h4{margin:0 0 8px;font-size:15px}
.mbox p{margin:0 0 6px;color:var(--tx2);font-size:13px;line-height:1.6}
.mbox .warn{color:#ffc46b;font-size:12.5px;margin-top:10px;padding:8px 10px;border-radius:8px;
            background:rgba(255,196,107,.08);border:1px solid rgba(255,196,107,.2);display:none}
.mbox .row{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);z-index:200;
       background:#20262e;border:1px solid rgba(255,255,255,.13);border-radius:11px;
       padding:10px 16px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.5);
       transition:transform .24s;display:flex;align-items:center;gap:10px}
.toast.show{transform:translate(-50%,0)}
.toast button{color:var(--accent);font-size:13px;font-weight:500}

@media (max-width:900px){
  .hd{gap:8px;padding:10px 12px;flex-wrap:wrap}
  .search{order:9;flex:1}
  .search input{width:100%}
  main{padding:6px 12px 96px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:9px}
  body.big .grid{grid-template-columns:1fr}

  /* 灯箱（手机）：图片按屏宽铺开、上下可滚，才看得到长图全貌；
     信息面板改成底部抽屉，默认只留一条把手，不再压掉图片高度 */
  .lb.show{display:block}
  .lb .stage{position:absolute;inset:0;display:block;padding:0;overflow:auto;
             -webkit-overflow-scrolling:touch}
  .lb .stage img{margin:0 auto;width:100%;height:auto;max-width:none;max-height:none;
                 border-radius:0;box-shadow:none;cursor:default;
                 padding:10px 0 76px;will-change:transform}
  .lb .stage img.actual{padding:0 0 76px}
  .lb .hint{display:none}
  .lb .nav{position:fixed;top:50%;margin-top:-33px;z-index:6;
           background:rgba(10,12,16,.5);backdrop-filter:blur(8px)}
  .lb .close{position:fixed;top:12px;right:12px;z-index:7;
             background:rgba(10,12,16,.6);backdrop-filter:blur(8px)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:74vh;
        padding:0 18px 16px;border-left:0;border-top:1px solid var(--line);
        border-radius:16px 16px 0 0;z-index:8;
        transform:translateY(calc(100% - 54px));
        transition:transform .24s cubic-bezier(.2,.9,.25,1);
        box-shadow:0 -14px 40px rgba(0,0,0,.55)}
  .side.open{transform:none}
  .side .grab{display:flex;align-items:center;height:54px;margin:0;
              font-size:13.5px;cursor:pointer;
              position:sticky;top:0;background:var(--bg2)}
  .side .grab i{display:block;position:absolute;left:50%;transform:translateX(-50%);
                width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
  .side .grab span{max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .grab .gi{display:block;margin-left:auto;font-size:11.5px;
                  color:var(--tx3);font-style:normal;font-weight:400}
  .side h3{display:none}
  .side .sub{margin-bottom:10px}
  .drawer{width:100%}
  .selbar{width:calc(100vw - 24px);flex-wrap:wrap;justify-content:flex-start;gap:8px;padding:10px 12px}
  .selbar .cnt{width:100%;margin-bottom:2px}
  .selbar .btn{flex:1 1 auto;white-space:nowrap}
}
/* 云端只读模式（MODE='cloud'）：静态托管没有后端，删除/回收站/打包收起 */
.cloud-mode #trashBtn,
.cloud-mode #selDel,
.cloud-mode .kill,
.cloud-mode #lbDel,
.cloud-mode #lbRename,
.cloud-mode #lbReveal{display:none!important}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand"><i class="dot"></i>画风库 · 全部图片 <span style="opacity:.35;font-size:11px;font-weight:400">v3</span></div>
    <div class="stat" id="stat">加载中…</div>
    <div class="spacer"></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="搜角色 / 画风 / 种子（空格可叠加）">
    </div>
    <button class="btn" id="bigBtn" title="切换每行图片大小">大图</button>
    <button class="btn" id="selBtn">选择</button>
    <button class="btn" id="saveBtn" title="保存到本机：单张点图片右上角 ⤓；多选后批量打包">保存</button>
    <button class="btn" id="trashBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      回收站 <span id="trashCnt" style="opacity:.6"></span>
    </button>
  </div>
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <select class="sort" id="charSel" title="按角色筛选"><option value="*">全部角色</option></select>
    <select class="sort" id="sort">
      <option value="new">最新优先</option>
      <option value="old">最旧优先</option>
      <option value="name">按名称</option>
      <option value="char">按角色</option>
      <option value="size">按体积</option>
    </select>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="sentinel" id="sentinel"></div>
</main>

<div class="selbar" id="selbar">
  <div class="cnt">已选 <b id="selCnt">0</b> 张</div>
  <button class="btn" id="selAll">全选当前</button>
  <button class="btn" id="selNone">取消</button>
  <button class="btn" id="selSave">保存选中</button>
  <button class="btn danger" id="selDel">删除选中</button>
</div>

<div class="lb" id="lb">
  <div class="stage">
    <button class="nav prev" id="lbPrev">‹</button>
    <img id="lbImg" alt="">
    <div class="hint">点击图片切换 1:1 原始像素 · 滚轮/拖动查看</div>
    <button class="nav next" id="lbNext">›</button>
    <button class="close" id="lbClose">✕</button>
  </div>
  <aside class="side" id="lbSide">
    <div class="grab" id="lbGrab"><i></i><span id="lbName"></span><em class="gi">信息 ⌃</em></div>
    <div class="sub" id="lbPath"></div>
    <div id="lbKv"></div>
    <div class="acts">
      <a class="btn" id="lbOrigLink" target="_blank" rel="noopener noreferrer">原图链接 ↗</a>
      <button class="btn" id="lbRename">改名 / 加名字</button>
      <button class="btn" id="lbSave">保存原图到本机</button>
      <button class="btn" id="lbFull">查看原图</button>
      <button class="btn" id="lbReveal">在资源管理器中打开</button>
      <button class="btn danger" id="lbDel">删除这张</button>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh">
    <h4>回收站</h4>
    <div class="stat" id="trashInfo" style="flex:1"></div>
    <button class="btn" id="drawerClose">关闭</button>
  </div>
  <div class="db" id="trashList"></div>
  <div class="df">
    <button class="btn" id="trashRestoreAll">全部恢复</button>
    <button class="btn danger" id="trashEmpty">清空回收站</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h4 id="mTitle">删除图片</h4>
    <p id="mBody"></p>
    <div class="warn" id="mWarn"></div>
    <div class="row">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn danger" id="mOk">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct" style="display:none"></button></div>

<script>
const S = { items:[], trash:[], group:'*', charFilter:'*', q:'', sort:'new',

const CHUNK = 140;

/* 部署模式：'local' = 连本机 gallery_server；'cloud' = 纯静态（读 index.json + 对象存储）。
   export_web.py 导出云端版时会自动把下面这行改成 'cloud'，其余代码一行不用动。
   图片 URL 一律走 thumbURL / previewURL / origURL 三个函数，不要在各处手拼。 */
const MODE = 'cloud';
/* 云端资源前缀：图片不在同一个域名下时填绝对地址（如 OSS），留空 = 同源相对路径。
   export_web.py 导出时按需改写这两行。 */
const ASSET_BASE = "https://liyuan570.oss-cn-beijing.aliyuncs.com/g/891488ba67ef";
const CLOUD = MODE === 'cloud';
if (CLOUD) document.documentElement.classList.add('cloud-mode');

function itemByP(p){ return (S.byPath && S.byPath[p]) || { p: p }; }
function assetUrl(rel){
  const b = String(ASSET_BASE || '').replace(/\/+$/, '');
  return b ? b + '/' + rel : rel;
}
function thumbURL(p, w){
  const it = itemByP(p);
  if (CLOUD && it.id) return assetUrl('t/' + it.id + (w >= 900 ? '_1200.webp' : '_400.webp'));
  return '/thumb?w=' + w + '&p=' + encodeURIComponent(p);
}
function previewURL(p){
  const it = itemByP(p);
  if (CLOUD && it.id) return assetUrl('v/' + it.id + '_1200.webp');
  return '/thumb?w=1400&p=' + encodeURIComponent(p);
}
function origURL(p){
  const it = itemByP(p);
  if (CLOUD && it.id) {
    /* 云端默认只传 web 版，o/ 目录不存在 → 回退到 1200px 预览，保证“保存”可用 */
    return it.has_orig ? assetUrl('o/' + it.id + (it.ext || '.png'))
                       : assetUrl('v/' + it.id + '_1200.webp');
  }
  return '/img?dl=1&p=' + encodeURIComponent(p);
}
const $ = s => document.querySelector(s);
const fmtSize = b => b > 1e9 ? (b/1e9).toFixed(2)+' GB'
             : b > 1e6 ? (b/1e6).toFixed(1)+' MB'
             : b > 1e3 ? Math.round(b/1e3)+' KB' : b+' B';
const fmtDate = t => { const d=new Date(t*1000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 数据 ---------- */
async function load(){
  /* 云端有两种取数方式：内联（window.__GALLERY__，入口页放在 GitHub Pages 时用，
     省一次请求也避开 CORS）或同目录 index.json。本机仍然打 /api/list。 */
  let d;
  if (CLOUD && window.__GALLERY__) d = window.__GALLERY__;
  else d = await (await fetch(CLOUD ? 'index.json' : '/api/list')).json();
  S.items = d.items; S.trash = d.trash || [];
  S.byPath = {}; S.items.forEach(it => { S.byPath[it.p] = it; });
  S.chars = d.chars || {}; S.styles = d.styles || {}; S.indexed = d.indexed || 0;
  renderChips(d.groups); renderCharSel(); applyFilter(); renderTrash();
}

/* 角色下拉：按图片数排序，只列有图的角色 */
function renderCharSel(){
  const sel = $('#charSel');
  const cnt = {};
  S.items.forEach(it=>{ if (it.char) cnt[it.char] = (cnt[it.char]||0)+1; });
  const rows = Object.keys(cnt).sort((a,b)=> cnt[b]-cnt[a] || a.localeCompare(b));
  const label = id => (S.chars[id] && S.chars[id].cn) || id;
  sel.innerHTML = `<option value="*">全部角色（${S.items.filter(i=>i.char).length}）</option>` +
    rows.map(id=>`<option value="${esc(id)}">${esc(label(id))}（${cnt[id]}）</option>`).join('') +
    `<option value="__none">未标注（${S.items.filter(i=>!i.char).length}）</option>`;
  sel.value = S.charFilter;
}

function renderChips(groups){
  const wrap = $('#chips');
  const total = S.items.length;
  const entries = Object.entries(groups).sort((a,b)=>b[1]-a[1]);
  let html = `<button class="chip on" data-g="*">全部<b>${total}</b></button>`;
  for (const [g,n] of entries){
    const label = g === '.' ? '根目录' : g.replace(/^stylelib\//,'').replace(/^out\//,'out/');
    html += `<button class="chip" data-g="${esc(g)}">${esc(label)}<b>${n}</b></button>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    S.group = c.dataset.g;
    wrap.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===c));
    applyFilter();
  });
}

function applyFilter(){
  const q = S.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/).filter(Boolean) : [];
  let arr = S.items.filter(it=>{
    if (S.group !== '*' && it.d !== S.group) return false;
    if (S.charFilter === '__none') { if (it.char) return false; }
    else if (S.charFilter !== '*' && it.char !== S.charFilter) return false;
    if (!terms.length) return true;
    // 搜索范围：人工命名、角色（中/英/别名）、画风（中/英）、参考图画师、种子、文件名、目录、生成参数
    const hay = [
      it.label, it.n, it.p, it.char, it.char_cn, it.style, it.style_cn, it.artist,
      it.seed, it.kind,
      it.m ? JSON.stringify(it.m) : ''
    ].filter(Boolean).join(' ').toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  const by = S.sort;
  arr.sort((a,b)=> by==='old'? a.t-b.t : by==='name'? a.n.localeCompare(b.n)
                 : by==='char'? (charLabel(a).localeCompare(charLabel(b)) || b.t-a.t)
                 : by==='size'? b.s-a.s : b.t-a.t);
  S.filtered = arr; S.shown = 0;
  $('#grid').innerHTML = '';
  renderMore();
  const bytes = arr.reduce((s,i)=>s+i.s,0);
  $('#stat').textContent = `${arr.length} 张 · ${fmtSize(bytes)}` +
      (arr.length !== S.items.length ? ` （共 ${S.items.length} 张）` : '');
}

/* 卡片上的主标题：优先角色中文名 */
function charLabel(it){
  if (it.label) return it.label;      // 人工命名优先，自动识别不出来时由人补
  if (it.char) return it.char_cn || it.char;
  if (it.artist) return it.artist;
  if (it.kind === 'ref') return it.style_cn || it.style || '画师参考';
  if (it.kind === 'compare') return '对比图';
  return it.n.replace(/\.[^.]+$/, '');
}
function metaLabel(it){
  const a = [];
  if (it.char && it.style) a.push(it.style_cn || it.style);
  else if (it.kind === 'ref') a.push('画师参考');
  else if (it.style) a.push(it.style_cn || it.style);
  if (it.kind === 'compare' && !it.style) a.push('对比');
  if (it.w && it.h) a.push(it.w + '×' + it.h);
  a.push(fmtSize(it.s));
  return a.join(' · ');
}
const isUntagged = it => !it.char && !it.artist && !it.style && it.kind !== 'compare';

function renderMore(){
  const grid = $('#grid');
  const slice = S.filtered.slice(S.shown, S.shown + CHUNK);
  if (!S.filtered.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#3a4250" stroke-width="1.5" style="margin:auto">
        <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>
      <b>没有匹配的图片</b>换个关键词或切回「全部」</div>`;
    $('#sentinel').textContent = '';
    return;
  }
  const frag = document.createDocumentFragment();
  slice.forEach(it=>{
    const div = document.createElement('div');
    div.className = 'card' + (S.sel.has(it.p) ? ' sel' : '') + (isUntagged(it) ? ' untagged' : '');
    div.dataset.p = it.p;
    // 用真实宽高撑出图片框，网格按它算高度 —— 图不会被裁
    div.style.setProperty('--ar', (it.w && it.h) ? (it.w / it.h) : 0.75);
    div.innerHTML = `
      <div class="pic">
        <div class="ph">◫</div>
        <img alt="${esc(charLabel(it))}" loading="lazy">
        <div class="tick">✓</div>
        <div class="save" title="保存到本机">⤓</div>
        <div class="kill" title="删除">✕</div>
      </div>
      <div class="cap">
        <div class="c1">${esc(charLabel(it))}</div>
        <div class="c2">${esc(metaLabel(it))}</div>
      </div>`;
    const img = div.querySelector('img');
    img.onload = () => img.classList.add('loaded');
    io.observe(img);
    img.dataset.src = thumbURL(it.p, 380);
    div.onclick = e => {
      if (e.target.closest('.kill')) { e.stopPropagation(); askDelete([it.p]); return; }
      if (e.target.closest('.save')) { e.stopPropagation(); saveOne(it.p); return; }
      if (S.selecting) { toggleSel(it.p, div); return; }
      openLb(it.p);
    };
    frag.appendChild(div);
  });
  grid.appendChild(frag);
  S.shown += slice.length;
  layoutSpans();
  $('#sentinel').textContent = S.shown < S.filtered.length ? '向下滚动加载更多…' : '';
}

/* 瀑布流排版：把每张卡片的真实高度换算成 2px 行高占几行。
   列宽一致，所以只需算一次；resize 或追加新卡时重排。 */
function layoutSpans(){
  const grid = $('#grid');
  const cards = grid.querySelectorAll(':scope > .card');
  if (!cards.length) return;
  const cs = getComputedStyle(grid);
  const rowH = parseFloat(cs.gridAutoRows) || 2;
  const gap = parseFloat(cs.rowGap) || 13;
  const colW = cards[0].getBoundingClientRect().width;
  if (!colW) return;
  const CAP = 54;                       // 52px 说明条 + 上下 1px 边框
  cards.forEach(c=>{
    const ar = parseFloat(c.style.getPropertyValue('--ar')) || 0.75;
    const picH = colW / Math.max(ar, 0.05);
    const span = Math.max(1, Math.ceil((picH + CAP + gap) / (rowH + gap)));
    c.style.gridRowEnd = 'span ' + span;
  });
}
let _rzT;
window.addEventListener('resize', ()=>{ clearTimeout(_rzT); _rzT = setTimeout(layoutSpans, 150); });

const io = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if (e.isIntersecting){
      const img = e.target;
      if (img.dataset.src){ img.src = img.dataset.src; img.removeAttribute('data-src'); }
      io.unobserve(img);
    }
  });
}, {rootMargin:'600px'});

new IntersectionObserver(es=>{
  if (es[0].isIntersecting && S.shown && S.shown < S.filtered.length) renderMore();
}, {rootMargin:'400px'}).observe($('#sentinel'));

/* ---------- 视图密度 ---------- */
(function initBig(){
  const on = localStorage.getItem('gallery.big') === '1';
  document.body.classList.toggle('big', on);
  const b = $('#bigBtn');
  b.classList.toggle('on', on);
  b.textContent = on ? '紧凑' : '大图';
  b.onclick = ()=>{
    const now = !document.body.classList.contains('big');
    document.body.classList.toggle('big', now);
    localStorage.setItem('gallery.big', now ? '1' : '0');
    b.classList.toggle('on', now);
    b.textContent = now ? '紧凑' : '大图';
    layoutSpans();                       // 列宽变了，重算瀑布流跨度
  };
})();

/* ---------- 选择 ---------- */
function toggleSel(p, el){
  if (S.sel.has(p)) S.sel.delete(p); else S.sel.add(p);
  const on = S.sel.has(p);
  if (el) el.classList.toggle('sel', on);
  $('#selCnt').textContent = S.sel.size;
  $('#selbar').classList.toggle('show', S.selecting);
}
$('#selBtn').onclick = () => {
  S.selecting = !S.selecting;
  document.body.classList.toggle('selecting', S.selecting);
  $('#selBtn').classList.toggle('on', S.selecting);
  $('#selBtn').textContent = S.selecting ? '退出选择' : '选择';
  if (!S.selecting){ S.sel.clear(); $('#selCnt').textContent = 0;
    document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel')); }
  $('#selbar').classList.toggle('show', S.selecting);
};
$('#selAll').onclick = () => {
  S.filtered.forEach(i=>S.sel.add(i.p));
  document.querySelectorAll('.card').forEach(c=>c.classList.add('sel'));
  $('#selCnt').textContent = S.sel.size;
};
$('#selNone').onclick = () => {
  S.sel.clear(); $('#selCnt').textContent = 0;
  document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));
};
$('#selDel').onclick = () => { if (S.sel.size) askDelete([...S.sel]); };

/* ---------- 保存（下载到本机） ---------- */
function triggerDownload(url, name){
  const a = document.createElement('a');
  a.href = url; a.download = name || '';
  a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>a.remove(), 1500);
}

function saveOne(p){
  triggerDownload(origURL(p), p.split('/').pop());
  toast('开始下载：' + p.split('/').pop());
}

async function saveSelected(){
  if (!S.sel.size){ toast('先选择要保存的图片'); return; }
  if (CLOUD){
    // 静态托管没有打包服务，改成逐张触发下载（浏览器会连续弹几个下载框）
    let i = 0;
    for (const p of [...S.sel]){ setTimeout(()=>saveOne(p), i++ * 500); }
    toast('云端模式：逐张下载 ' + S.sel.size + ' 张');
    return;
  }
  const btn = $('#selSave'), old = btn.textContent;
  btn.disabled = true; btn.textContent = '打包中…';
  try {
    const r = await fetch('/api/zip', {method:'POST', headers:{'Content-Type':'application/json'},
                                      body: JSON.stringify({paths:[...S.sel]})});
    const d = await r.json();
    if (!d.ok){ toast(d.err || '打包失败'); return; }
    triggerDownload(d.url, d.name);
    toast(`已打包 ${d.count} 张 · ${fmtSize(d.size)}，开始下载`);
  } catch (e){
    toast('打包失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}
$('#selSave').onclick = saveSelected;

// 顶栏「保存」：已选中就批量打包；没选中就引导进选择模式，避免「找不到保存入口」
$('#saveBtn').onclick = () => {
  if (S.sel.size){ saveSelected(); return; }
  if (!S.selecting) $('#selBtn').click();
  toast('勾选图片后点「保存选中」；只想存单张，可直接点图片右上角 ⤓');
};

/* ---------- 灯箱 ---------- */
function visList(){ return S.filtered; }
function openLb(p){
  const list = visList();
  const i = list.findIndex(x=>x.p===p);
  if (i < 0) return;
  S.lbIndex = i; paintLb();
  $('#lb').classList.add('show');
  $('#lbSide').classList.remove('open');
  document.body.style.overflow = 'hidden';   // 手机上看图时锁住背景滚动
}
function closeLb(){
  $('#lb').classList.remove('show');
  $('#lbSide').classList.remove('open');
  document.body.style.overflow = '';
}
function paintLb(){
  const list = visList(), it = list[S.lbIndex];
  if (!it) return;
  // 预览用 1400px 的 webp：尺寸够看全，体积只有原图零头（手机加载快）
  const im = $('#lbImg');
  im.classList.remove('actual');
  im.dataset.orig = '0';
  im.src = previewURL(it.p);
  // 原图直链：新窗口/新标签打开，手机上可以直接用其它 App 打开或长按保存
  const olink = $('#lbOrigLink');
  if (olink){
    olink.href = origURL(it.p);
    olink.textContent = (CLOUD && it.has_orig) ? '原图链接（原件）↗'
                      : (CLOUD ? '原图链接（1200px）↗' : '原图链接 ↗');
  }
  $('#lbFull').classList.remove('on');
  $('#lbSide').classList.remove('open');
  $('#lbName').textContent = charLabel(it);
  $('#lbPath').textContent = it.p;
  const rows = [];
  if (it.char) rows.push(['角色', `${it.char_cn || it.char}　${it.char}`]);
  if (it.style){
    const st = S.styles[it.style] || {};
    rows.push(['画风', `${st.cn || it.style}${st.retired ? '（已出库）' : ''}　${it.style}`]);
  }
  if (it.artist && !it.style) rows.push(['画师参考', it.artist]);
  rows.push(['尺寸', `${it.w}×${it.h}`],
            ['体积', fmtSize(it.s)],
            ['修改时间', fmtDate(it.t)],
            ['目录', it.d === '.' ? '根目录' : it.d]);
  if (it.m){
    if (it.m.scene) rows.push(['场景', it.m.scene]);
    if (it.m.preset) rows.push(['浓度档', it.m.preset]);
    if (it.m.steps) rows.push(['采样', `${it.m.steps} steps · cfg ${it.m.cfg}`]);
    if (it.m.sampler) rows.push(['采样器', `${it.m.sampler} / ${it.m.scheduler}`]);
  }
  if (it.seed) rows.push(['种子', it.seed]);
  $('#lbKv').innerHTML = rows.map(([k,v])=>`<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`).join('');
}
function lbStep(d){
  const list = visList();
  if (!list.length) return;
  S.lbIndex = (S.lbIndex + d + list.length) % list.length;
  paintLb();
}
$('#lbPrev').onclick = ()=>lbStep(-1);
$('#lbNext').onclick = ()=>lbStep(1);
$('#lbClose').onclick = closeLb;
$('#lb').onclick = e => {
  if (e.target.id === 'lb' || e.target.classList.contains('stage')) closeLb();
};
/* 点图切 1:1 原始像素（桌面）；手机上图片已按屏宽铺满，不抢点击 */
$('#lbImg').onclick = e => {
  e.stopPropagation();
  if (matchMedia('(max-width:900px)').matches) return;
  e.target.classList.toggle('actual');
};
/* 「查看原图」：预览图 ↔ 原始文件 */
$('#lbFull').onclick = ()=>{
  const it = visList()[S.lbIndex]; if (!it) return;
  const im = $('#lbImg');
  const on = im.dataset.orig === '1';
  im.dataset.orig = on ? '0' : '1';
  im.src = on ? previewURL(it.p) : origURL(it.p);
  $('#lbFull').classList.toggle('on', !on);
};
/* 手动命名：自动识别认不出的图（没有 prompt / 拼图 / 外部导入）由人来补名字。
   存到服务端的 gallery/labels.json，不进 meta_index.json（那份是生成物，重跑会被覆盖）。 */
$('#lbRename').onclick = async ()=>{
  const it = visList()[S.lbIndex]; if (!it) return;
  const name = prompt('给这张图起个名字（留空 = 撤销命名）', it.label || '');
  if (name === null) return;
  const nm = name.trim();
  try{
    const r = await fetch('/api/rename', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({p: it.p, name: nm})
    });
    const d = await r.json();
    if (!d.ok){ toast('改名失败：' + (d.err || '未知错误')); return; }
    const t = S.items.find(x=>x.p===it.p);
    if (t){ if (d.name) t.label = d.name; else delete t.label; }
    it.label = d.name || undefined;
    toast(d.name ? '已命名：' + d.name : '已撤销命名');
    paintLb(); applyFilter();
  }catch(e){ toast('改名失败：' + e.message); }
};
/* 手机：底部信息抽屉 */
$('#lbGrab').onclick = ()=>$('#lbSide').classList.toggle('open');
$('#lbDel').onclick = ()=>{ const it = visList()[S.lbIndex]; if (it) askDelete([it.p]); };
$('#lbSave').onclick = ()=>{ const it = visList()[S.lbIndex]; if (it) saveOne(it.p); };
$('#lbReveal').onclick = ()=>{ const it = visList()[S.lbIndex]; if (it)
  fetch('/api/reveal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p:it.p})}); };

/* ---------- 删除 ---------- */
function askDelete(paths){
  if (CLOUD){ toast('云端是只读快照，删图请在电脑上操作'); return; }
  const names = paths.slice(0,4).map(p=>p.split('/').pop());
  $('#mTitle').textContent = paths.length===1 ? '删除这张图片？' : `删除 ${paths.length} 张图片？`;
  $('#mBody').innerHTML = (paths.length<=4
      ? names.map(n=>`<div style="color:#c9cfda;font-size:12.5px">· ${esc(n)}</div>`).join('')
      : `<div style="color:#c9cfda;font-size:12.5px">· ${esc(names.join('、'))} 等 ${paths.length} 个文件</div>`)
    + `<div style="margin-top:9px;color:#7d8595;font-size:12.5px">文件会移入回收站，可以随时恢复。</div>`;
  const w = paths.filter(p=>p.startsWith('stylelib/sample/'));
  $('#mWarn').style.display = w.length ? 'block' : 'none';
  $('#mWarn').textContent = w.length
    ? `注意：其中 ${w.length} 张是画风库的基准样张，删掉后风格页会缺图，结构自审会报错。` : '';
  const modal = $('#modal'); modal.classList.add('show');
  $('#mCancel').onclick = ()=>modal.classList.remove('show');
  $('#mOk').onclick = async ()=>{ modal.classList.remove('show'); await doDelete(paths); };
}

async function doDelete(paths){
  const r = await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
                                        body:JSON.stringify({paths})});
  const d = await r.json();
  if (!d.ok){ toast('删除失败'); return; }
  const set = new Set(d.done);
  S.items = S.items.filter(i=>!set.has(i.p));
  set.forEach(p=>S.sel.delete(p));
  S.trash = d.trash;
  S.lastBatch = d.done;
  renderCharSel(); applyFilter(); renderTrash();
  $('#selCnt').textContent = S.sel.size;
  if ($('#lb').classList.contains('show')){
    const list = visList();
    if (!list.length) closeLb();
    else { S.lbIndex = Math.min(S.lbIndex, list.length-1); paintLb(); }
  }
  toast(`已删除 ${d.done.length} 张`, ()=>undo());
}

async function undo(){
  if (!S.lastBatch.length) return;
  const r = await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},
                                        body:JSON.stringify({names: S.trash.filter(m=>S.lastBatch.includes(m.orig)).map(m=>m.name)})});
  const d = await r.json();
  S.trash = d.trash;
  await load();
  toast(`已恢复 ${d.done.length} 张`);
}

/* ---------- 回收站 ---------- */
function renderTrash(){
  $('#trashCnt').textContent = S.trash.length ? S.trash.length : '';
  $('#trashInfo').textContent = S.trash.length
    ? `${S.trash.length} 个文件 · ${fmtSize(S.trash.reduce((s,m)=>s+m.size,0))}` : '空';
  $('#trashList').innerHTML = S.trash.length ? S.trash.slice().reverse().map(m=>`
    <div class="tr" data-n="${esc(m.name)}">
      <div class="nm"><div>${esc(m.orig.split('/').pop())}</div>
        <div>${esc(m.orig)} · ${fmtSize(m.size)}</div></div>
      <button data-a="r">恢复</button>
      <button data-a="d">彻底删</button>
    </div>`).join('') : `<div class="empty" style="padding:40px 10px"><b>回收站是空的</b>删除的图片会先放这里</div>`;
  $('#trashList').querySelectorAll('.tr').forEach(row=>{
    row.querySelectorAll('button').forEach(b=>b.onclick = async ()=>{
      const name = row.dataset.n;
      const url = b.dataset.a === 'r' ? '/api/restore' : '/api/purge';
      const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({names:[name]})});
      const d = await r.json(); S.trash = d.trash; renderTrash();
      if (b.dataset.a === 'r'){ await load(); toast('已恢复'); } else toast('已彻底删除');
    });
  });
}
$('#trashBtn').onclick = ()=>{ $('#drawer').classList.add('show'); $('#scrim').classList.add('show'); };
$('#drawerClose').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;
function closeDrawer(){ $('#drawer').classList.remove('show'); $('#scrim').classList.remove('show'); }
$('#trashRestoreAll').onclick = async ()=>{
  if (!S.trash.length) return;
  const r = await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({all:true})});
  const d = await r.json(); S.trash = d.trash; renderTrash(); await load(); toast(`已恢复 ${d.done.length} 张`);
};
$('#trashEmpty').onclick = async ()=>{
  if (!S.trash.length) return;
  if (!confirm(`彻底删除回收站里的 ${S.trash.length} 个文件？此操作不可恢复。`)) return;
  const r = await fetch('/api/purge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({all:true})});
  const d = await r.json(); S.trash = d.trash; renderTrash(); toast('回收站已清空');
};

/* ---------- 其它 ---------- */
$('#q').oninput = e => { S.q = e.target.value; applyFilter(); };
$('#sort').onchange = e => { S.sort = e.target.value; applyFilter(); };
$('#charSel').onchange = e => { S.charFilter = e.target.value; applyFilter(); };

let toastTimer;
function toast(msg, action){
  $('#toastMsg').textContent = msg;
  const a = $('#toastAct');
  if (action){ a.style.display='inline'; a.textContent='撤销'; a.onclick = ()=>{ a.style.display='none'; action(); }; }
  else a.style.display='none';
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$('#toast').classList.remove('show'), 5200);
}

document.addEventListener('keydown', e=>{
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); $('#q').focus(); }
  if (!$('#lb').classList.contains('show')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') lbStep(-1);
  if (e.key === 'ArrowRight') lbStep(1);
  if (e.key === 's' || e.key === 'S'){ const it = visList()[S.lbIndex]; if (it) saveOne(it.p); }
});

load();

</script>
</body>
</html>
